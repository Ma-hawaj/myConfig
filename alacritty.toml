[font]
normal = { family = "MonaspiceAr Nerd Font", style = "Regular" }
bold = { family = "MonaspiceRn Nerd Font", style = "Bold" }
italic = { family = "MonaspiceRn Nerd Font", style = "Italic" }
bold_italic = { family = "MonaspiceRn Nerd Font", style = "Bold Italic" }

size = 15

[terminal]
shell = { program = "wsl", args = ["~"] }

[keyboard]
bindings = [
    { key = "Space", mods = "Control", chars = "\u0000" }
]
